name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: los, POSTGRES_PASSWORD: los, POSTGRES_DB: los_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U los -d los_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Тестүүд бодит Postgres/Redis-тэй ажиллана (service container). Нэр нь `test`-ээр төгссөн DB л устгагдана.
      TEST_DATABASE_URL: postgresql://los:los@localhost:5432/los_test
      REDIS_URL: redis://localhost:6379/2
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # хувилбар: package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
