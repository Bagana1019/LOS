services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: los, POSTGRES_PASSWORD: los, POSTGRES_DB: los }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./packages/database/init:/docker-entrypoint-initdb.d"]
  dwh:
    image: postgres:16
    environment: { POSTGRES_USER: dwh, POSTGRES_PASSWORD: dwh, POSTGRES_DB: dwh }
    ports: ["5433:5432"]
    volumes: ["dwhdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
volumes: { pgdata: {}, dwhdata: {}, miniodata: {} }
